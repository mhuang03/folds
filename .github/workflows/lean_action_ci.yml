name: Lean Action CI

# Fast check on every push: builds the core library `Folds` (a few minutes).
# The certificate-heavy library `FoldsCerts` is checked by certs.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Folds"
